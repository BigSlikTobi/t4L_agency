[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t4l-radio-agency"
version = "0.1.0"
description = "NFL radio show orchestration using the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.8,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "openai-agents>=0.2.8",
  "PyYAML>=6.0.2,<7.0.0",
  "pydantic-settings>=2.7.1,<3.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "typer>=0.15.1,<1.0.0",
  "uvicorn>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4,<9.0.0",
  "pytest-asyncio>=0.25.3,<1.0.0",
]

[project.scripts]
radio-rundown = "app.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.newsroom" = ["prompts.yml"]
